<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>族語射手 TRUKU WORD ARCHER</title>
<!--
  ===================================================================
  薄路由（device router）— 依裝置自動分流到手機版 / 桌機版
  -------------------------------------------------------------------
  本檔取代「把 hunter-truku-v2.html 複製成 index.html」的舊部署做法。
  桌機遊戲檔 hunter-truku-v2.html 本身零改動，仍是桌機的完整入口。

  分流規則（client-side，純偵測 + location.replace 轉址）：
    - ?mode=mobile / ?mode=desktop  → 手動覆寫，並記入 localStorage
    - localStorage 記住的偏好         → 次要優先
    - 自動偵測：pointer:coarse 或 視窗寬度 <= 820  → 手機版
    - 其餘                            → 桌機版
  用 location.replace() 轉址，不污染上一頁歷史（返回鍵不會卡在路由頁）。
  ===================================================================
-->
<style>
  html,body{margin:0;height:100%;background:#0A2A08;color:#FFD700;
    font-family:'Noto Sans TC',system-ui,sans-serif;overflow:hidden;}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 50% 35%,#123a0c,#040f03);}
  .t{font-size:22px;letter-spacing:2px;font-weight:900;color:#FFD700;
    text-shadow:0 2px 0 #5A3000;}
  .s{font-size:13px;opacity:.7;letter-spacing:1px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#F5A623;animation:blink 1s infinite alternate;margin:0 3px;}
  .dot:nth-child(2){animation-delay:.25s;}
  .dot:nth-child(3){animation-delay:.5s;}
  @keyframes blink{from{opacity:.25;}to{opacity:1;}}
</style>
<script>
(function(){
  'use strict';
  var APP_VERSION = '20260824g';
  var DESKTOP = 'hunter-truku-v2.html';
  var MOBILE  = 'mobile.html';
  var WIDTH_THRESHOLD = 820;   // <= 視為手機

  var params = new URLSearchParams(location.search);
  var forced = params.get('mode');           // 'mobile' | 'desktop' | null
  var stored = null;
  try { stored = localStorage.getItem('twa_mode'); } catch(e){}

  // 手動覆寫優先，並記住；?mode=auto 可清除記憶回到自動偵測
  if (forced === 'mobile' || forced === 'desktop'){
    try { localStorage.setItem('twa_mode', forced); } catch(e){}
    stored = forced;
  } else if (forced === 'auto'){
    try { localStorage.removeItem('twa_mode'); } catch(e){}
    stored = null;
  }

  function detectMobile(){
    // 不只靠 UA：pointer:coarse（觸控主指標）或視窗寬度門檻
    var coarse = false;
    try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch(e){}
    var narrow = window.innerWidth <= WIDTH_THRESHOLD;
    return coarse || narrow;
  }

  var goMobile;
  if (stored === 'mobile') goMobile = true;
  else if (stored === 'desktop') goMobile = false;
  else goMobile = detectMobile();

  var target = goMobile ? MOBILE : DESKTOP;

  // 保留除 mode 外的既有查詢字串一併帶過去（例如 ?debug=1、?autostart=1）
  params.delete('mode');
  if (!params.has('v')) params.set('v', APP_VERSION);
  var qs = params.toString();
  if (qs) target += (target.indexOf('?') >= 0 ? '&' : '?') + qs;

  // location.replace：不留下路由頁在歷史中
  location.replace(target);
})();
</script>
</head>
<body>
  <div class="wrap">
    <div class="t">TRUKU WORD ARCHER</div>
    <div class="s">載入中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
</body>
</html>
